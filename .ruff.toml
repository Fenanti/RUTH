# Configurazione Ruff per il progetto StampaChiusura
#25/11/2026

[lint]
# Regole da ignorare perché non applicabili a questa app desktop
ignore = [
    "BLE001",   # blind except: vogliamo catturare Exception per mostrare errori all'utente
    "S110",     # try-except-pass: va bene per cleanup silenziosi (es. rimozione file temp)
]

# Ordina automaticamente gli import quando formatti
[lint.isort]
known-first-party = ["src"]